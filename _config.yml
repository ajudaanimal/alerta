title: "Socorro Animal"
description: "Portal de resgate de animais"
markdown: kramdown
url: "https://ajudaanimal.github.io"
baseurl: "/alerta"

# 1. ADICIONAR ISTO: Obriga o Jekyll a gerar a página mesmo que a hora pareça futura
future: true 

collections:
  ocorrencias:
    output: true
    # 2. ALTERAR ISTO: Mudar de :path para :name garante um link limpo e fiável
    permalink: /ocorrencias/:name/ 

defaults:
  - scope:
      path: ""
      type: "ocorrencias"
    values:
      layout: "ocorrencia"
