title: "Socorro Animal"
description: "Portal de resgate de animais"
markdown: kramdown
url: "https://central-animal.github.io"
baseurl: "/alerta"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag

future: true

collections:
  ocorrencias:
    output: true
    permalink: /ocorrencias/:name/

defaults:
  - scope:
      path: ""
      type: "ocorrencias"
    values:
      layout: "ocorrencia"
      
include:
  - feed.xsl
