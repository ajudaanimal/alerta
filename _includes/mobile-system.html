<!-- ========================================================== -->
<!-- SISTEMA MOBILE INTEGRADO: MAPA NO TOPO (30% H), LISTA ABAIXO -->
<!-- ========================================================== -->

<!-- 1. Barra de Navegação Inferior para Mobile -->
<nav class="app-bottom-nav" id="appBottomNav">
  <button type="button" class="nav-tab-btn active" id="navBtnMain" onclick="switchMobileMode('split')">
    <span class="tab-icon">🗺️📋</span>
    <span>Mapa & Lista</span>
  </button>
  <button type="button" class="nav-tab-btn" id="navBtnFicha" onclick="switchMobileMode('ficha')">
    <span class="tab-icon">🐾</span>
    <span>Detalhes</span>
  </button>
</nav>

<!-- 2. CSS Exclusivo do Mobile (Stack Vertical, Mapa 30%, Sem Sidebar Direita) -->
<style>
  .app-bottom-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 52px;
    background: var(--card-bg);
    border-top: 1px solid var(--border-color);
    z-index: 1500;
    justify-content: space-around;
    align-items: center;
    box-shadow: -4px 0 10px rgba(0,0,0,0.05);
  }

  .nav-tab-btn {
    flex: 1;
    height: 100%;
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    gap: 2px;
    text-transform: uppercase;
  }
  .nav-tab-btn span.tab-icon { font-size: 16px; }
  .nav-tab-btn.active { color: var(--primary-color, #2563eb); }

  @media screen and (max-width: 992px) {
    /* Eliminar completamente a barra lateral direita */
    .app-right-panel {
      display: none !important;
    }

    /* Transformar o wrapper principal num contentor vertical fluido */
    .app-layout-wrapper {
      display: flex !important;
      flex-direction: column !important;
      height: calc(100vh - 52px) !important;
      position: relative !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Painel do Mapa no Topo: exatamente 30% da altura do ecrã */
    .app-center-panel {
      display: flex !important;
      position: relative !important;
      order: 1 !important;
      width: 100% !important;
      height: 30vh !important;
      min-height: 30vh !important;
      max-height: 30vh !important;
      flex-shrink: 0 !important;
      z-index: 1000 !important;
    }

    /* Painel da Lista / Conteúdo Principal: ocupa o restante espaço abaixo do mapa (70vh) */
    .app-left-panel {
      display: flex !important;
      position: relative !important;
      order: 2 !important;
      width: 100% !important;
      height: 70vh !important;
      max-height: 70vh !important;
      flex-grow: 1 !important;
      overflow-y: auto !important;
      z-index: 1000 !important;
      background: var(--bg-color, #f1f5f9);
    }

    /* Ativar barra inferior em mobile */
    .app-bottom-nav { 
      display: flex !important; 
    }

    /* Se o utilizador alternar para o modo 'ficha' via tab inferior */
    .app-layout-wrapper.mobile-mode-ficha .app-center-panel,
    .app-layout-wrapper.mobile-mode-ficha .app-left-panel {
      display: none !important;
    }
    
    .app-layout-wrapper.mobile-mode-ficha .app-right-panel {
      display: flex !important;
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1200 !important;
      padding-bottom: 60px !important;
      overflow-y: auto !important;
    }
  }
</style>

<!-- 3. JavaScript de Controlo de Comportamento Mobile -->
<script>
  function switchMobileMode(mode) {
    const wrapper = document.getElementById('appLayoutWrapper');
    if (!wrapper) return;

    document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));

    if (mode === 'split') {
      wrapper.classList.remove('mobile-mode-ficha');
      document.getElementById('navBtnMain')?.classList.add('active');
      
      // Corrigir redimensionamento do Leaflet map ao voltar ao topo
      if (typeof mapInstance !== 'undefined' && mapInstance) {
        setTimeout(() => {
          mapInstance.invalidateSize();
        }, 150);
      }
    } else if (mode === 'ficha') {
      wrapper.classList.add('mobile-mode-ficha');
      document.getElementById('navBtnFicha')?.classList.add('active');
    }
  }
</script>
