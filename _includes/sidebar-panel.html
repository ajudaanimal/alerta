<div class="app-right-panel" id="appRightPanel">
  <div class="panel-collapsible-content">
    <div class="panel-header-bar" style="justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="panel-action-btn mobile-back-btn" onclick="switchMobileTab('map')" title="Voltar" style="display: none;">↩</button>
        <span style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Ficha de Ocorrência</span>
      </div>
      <button class="panel-action-btn" onclick="toggleRightPanel()" title="Recolher painel">▶</button>
    </div>
    
    <div class="app-right-panel-inner" id="appRightPanelInner">
      <!-- Placeholder inicial -->
      <div class="ficha-placeholder" id="fichaPlaceholder">
        <span style="font-size: 28px;">🐾</span>
        <strong>Selecione uma ocorrência</strong>
        <p style="margin: 0; font-size: 11px;">Clique num registo da lista ou num marcador no mapa para inspecionar os detalhes.</p>
      </div>

      <!-- Estrutura Completa da Ficha (preenchida dinamicamente via JS) -->
      <div class="ficha-content-container" id="fichaContentContainer" style="display: none;">
        <header class="report-header" id="sidebarHeader">
          <div class="report-header-top" id="sidebarHeaderTop">
            <div>
              <h1 id="sidebarTitle" style="font-size: 14px; font-weight: 800; margin: 0; line-height: 1.3;"></h1>
              <div class="header-location" id="sidebarLocation" style="font-size: 12px; font-weight: 700; margin-top: 3px;"></div>
            </div>
            <div class="report-header-right">
              <div>
                <h3 id="sidebarDate" style="font-size: 9px; text-transform: uppercase; margin: 0;"></h3>
                <h2 id="sidebarAlertLevel" style="font-size: 11px; font-weight: 800; margin: 0;"></h2>
              </div>
            </div>
          </div>
          <div class="status-banner" id="sidebarStatusBanner"></div>
        </header>

        <main class="report-body" style="padding: 12px; display: flex; flex-direction: column; gap: 10px;">
          <div class="top-section" style="display: grid; grid-template-columns: 130px 1fr; gap: 10px;">
            <div class="animal-img-container" style="height: 110px;">
              <img id="sidebarAnimalImg" src="" alt="Fotografia do animal" onerror="this.src='{{ site.baseurl }}/_assets/img/animal.jpeg';">
            </div>
            <div class="unified-highlight-box" id="sidebarHighlightBox">
              <div class="box-row">
                <label>Situação</label>
                <span id="sidebarSituacao">N/D</span>
              </div>
              <div class="box-row">
                <label>Estado Físico</label>
                <span id="sidebarEstadoFisico">N/D</span>
              </div>
              <div class="box-row">
                <label>Alerta</label>
                <span id="sidebarAlertaBox">N/D</span>
              </div>
            </div>
          </div>
            
          <h2 class="section-title">🩺 Observações</h2>
          <div class="content-box">
            <div id="sidebarObsContent">Sem observações.</div>
          </div>
            
          <h2 class="section-title">📝 Detalhes e Dados</h2>
          <div class="content-box" id="sidebarDetailsBox" style="display: flex; flex-direction: column; gap: 4px;">
            <!-- Preenchido via JS -->
          </div>
        </main>

        <footer class="report-footer" style="padding: 10px 12px;">
          <div style="color: var(--text-muted); font-weight: 700; font-size: 10px;">
            ID: <span id="sidebarCaseId">N/D</span> — <a id="sidebarRemoveLink" href="#" style="color: var(--text-main); text-decoration: underline;">Pedir remoção</a>
          </div>
          <div class="btn-group">
            <button type="button" id="sidebarWhatsappBtn" class="btn">WhatsApp</button>
            <button type="button" id="sidebarCopyBtn" class="btn">📋 Copiar</button>
            <a id="sidebarIndividualLink" href="#" class="btn">🔗 Ficha Completa</a>
          </div>
        </footer>
      </div>
    </div>
  </div>
  <button class="collapsed-edge-bar" onclick="toggleRightPanel()" title="Expandir Painel de Detalhes">
    <span>◀ FICHA DO ANIMAL</span>
  </button>
</div>
