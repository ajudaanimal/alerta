<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- SEO & Open Graph / Redes Sociais -->
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}
    
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    
    {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
    {% endif %}

    <!-- Script para carregar o modo escuro sem piscar a página -->
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
        }

        html.dark-mode {
            --bg-color: #0f172a;
            --text-main: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        /* Cabeçalho Global Fixo */
        .site-global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-main);
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .site-main-content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Global: Título à esquerda, Botão de Tema à direita -->
    <header class="site-global-header">
        <a href="{{ '/' | relative_url }}" class="site-title">🐾 Alerta Animal</a>
        <button type="button" class="theme-toggle-btn" onclick="toggleGlobalDarkMode()" title="Alternar Tema">🌓</button>
    </header>

    <!-- O conteúdo de cada página específica entra aqui -->
    <main class="site-main-content">
        {{ content }}
    </main>

    <script>
        function toggleGlobalDarkMode() {
            let isDark = document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
        }
    </script>
</body>
</html>
