<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- SEO & Open Graph / Redes Sociais -->
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}
    
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    
    {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
    {% endif %}

    <!-- Script para carregar o modo escuro sem piscar a página -->
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --accent-emergency: #ef4444;
            --accent-report: #10b981;
            --pill-bg: #f1f5f9;
            --pill-text: #334155;
        }

        html.dark-mode {
            --bg-color: #0f172a;
            --text-main: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
            --pill-bg: #334155;
            --pill-text: #f1f5f9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        /* Cabeçalho Global: Título à esquerda, Menu e Ferramentas à direita */
        .site-global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .site-title {
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Contentor do lado direito (Menu + Alternador de Tema) */
        .header-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        /* Navegação e Pílulas */
        .fs-nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .fs-nav-links span {
            font-size: 13px;
            color: var(--text-main);
            opacity: 0.8;
            margin-right: 4px;
        }

        .fs-pill {
            background: var(--pill-bg);
            color: var(--pill-text);
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .fs-pill:hover {
            opacity: 0.85;
        }

        .btn-home {
            background-color: #e0f2fe;
            color: #0369a1;
            border-color: #bae6fd;
        }

        html.dark-mode .btn-home {
            background-color: #082f49;
            color: #bae6fd;
            border-color: #0369a1;
        }

        .btn-emergency {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        html.dark-mode .btn-emergency {
            background-color: #450a0a;
            color: #fca5a5;
            border-color: #7f1d1d;
        }

        .btn-report {
            background-color: #d1fae5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        html.dark-mode .btn-report {
            background-color: #022c22;
            color: #6ee7b7;
            border-color: #065f46;
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Conteúdo a ocupar 100% da largura do ecrã */
        .site-main-content {
            padding: 20px;
            width: 100%;
            max-width: none !important;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Global -->
    <header class="site-global-header">
        <a href="{{ '/' | relative_url }}" class="site-title">🐾 Alerta Animal</a>
        
        <!-- Grupo alinhado à direita: Menu e Modo Escuro -->
        <div class="header-right-group">
            <nav class="fs-nav-links" aria-label="Navegação Principal">
                <a href="{{ '/' | relative_url }}" class="fs-pill btn-home" aria-label="Página Principal">🏠 Início</a>
                <a href="{{ '/emergencia/' | relative_url }}" class="fs-pill btn-emergency" aria-label="Contactos">📞 Contactos</a>
                <a href="{{ '/veterinarios.html' | relative_url }}" class="fs-pill" aria-label="Ver Mapa de Ocorrências">🗺️ Veterinários</a>
                <a href="https://forms.gle/H8KxdxXfuZz69mW56" target="_blank" rel="noopener noreferrer" class="fs-pill btn-report" aria-label="Reportar nova ocorrência">➕ Reportar</a>
            </nav>
            
            <button type="button" class="theme-toggle-btn" onclick="toggleGlobalDarkMode()" title="Alternar Tema">🌓</button>
        </div>
    </header>

    <!-- O conteúdo de cada página estica agora a 100% do ecrã -->
    <main class="site-main-content">
        {{ content }}
    </main>

    <script>
        function toggleGlobalDarkMode() {
            let isDark = document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
        }
    </script>
</body>
</html>
