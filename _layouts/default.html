<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- SEO & Open Graph / Redes Sociais -->
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}
    
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    
    {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
    {% endif %}

    <!-- Script para carregar o modo escuro sem piscar a página -->
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --primary-color: #0284c7;
        }

        html.dark-mode {
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #111827;
            --border-color: #1f2937;
            --primary-color: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Cabeçalho Global Acessível */
        .site-global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            height: 48px;
            box-sizing: border-box;
            flex-shrink: 0;
            z-index: 2000;
        }

        .site-title {
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-main);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .fs-nav-links {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .fs-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 100%;
            text-decoration: none;
            font-size: 16px;
            border-left: 1px solid var(--border-color);
            background: transparent;
            box-sizing: border-box;
            transition: background 0.15s;
        }
        .fs-pill:hover {
            background: rgba(100, 100, 100, 0.08);
        }

        /* Estilo específico para o botão com texto "Reportar ocorrência" */
        .fs-pill.fs-report-btn {
            width: auto;
            padding: 0 14px;
            gap: 6px;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            color: var(--text-main);
        }

        .theme-toggle-btn {
            background: transparent;
            border: none;
            border-left: 1px solid var(--border-color);
            width: 44px;
            height: 100%;
            cursor: pointer;
            font-size: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .theme-toggle-btn:hover {
            background: rgba(100, 100, 100, 0.08);
        }

        /* Conteúdo Principal */
        .site-main-content {
            padding: 32px 20px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            flex: 1;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Comportamento Fullscreen para o Desktop (Index) */
        body.layout-fullscreen .site-main-content {
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            height: calc(100vh - 48px) !important;
            flex: none !important;
        }

        /* Rodapé Global */
        .site-global-footer {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 14px 20px;
            font-size: 13px;
            color: var(--text-muted);
            box-sizing: border-box;
            flex-shrink: 0;
            z-index: 100;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            color: var(--text-main);
            text-decoration: underline;
        }

        /* Ajustes específicos para Mobile em modo Fullscreen (Index) */
        @media (max-width: 992px) {
            body.layout-fullscreen .site-global-footer {
                display: none !important;
            }
            body.layout-fullscreen .site-main-content {
                height: calc(100vh - 48px - 60px) !important;
            }
            .footer-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body class="{% if page.layout_fullscreen or page.url == '/' or page.url == '/index.html' %}layout-fullscreen{% endif %}">

    <!-- Cabeçalho Global Acessível -->
    <header class="site-global-header">
        <a href="{{ '/' | relative_url }}" class="site-title">🐾 Alerta Animal</a>
        
        <div class="header-right-group">
            <nav class="fs-nav-links" aria-label="Navegação Principal">
                <a href="{{ '/' | relative_url }}" class="fs-pill" title="Mapa">🗺️</a>
                <a href="{{ '/subscrever/' | relative_url }}" class="fs-pill" title="Subscrever Alertas">🔔</a>
                <a href="{{ '/emergencia/' | relative_url }}" class="fs-pill" title="Contactos de Emergência">📞</a>
                <a href="{{ '/formulario/' | relative_url }}" class="fs-pill fs-report-btn" title="Reportar Ocorrência">➕ Reportar ocorrência</a>
                <a href="{{ '/about/' | relative_url }}" class="fs-pill" title="Sobre">❓</a> 
            </nav>
            <button type="button" class="theme-toggle-btn" onclick="toggleGlobalDarkMode()" title="Alternar Tema">🌓</button>
        </div>
    </header>

    <!-- Conteúdo da Página -->
    <main class="site-main-content">
        {{ content }}
    </main>

    <!-- Rodapé Global -->
    <footer class="site-global-footer">
        <div class="footer-container">
            <div>
                <span><strong>🐾 Alerta Animal</strong></span>
            </div>
            <div class="footer-links">
                <a href="{{ '/subscrever/' | relative_url }}">Subscrever</a>
                <a href="{{ '/emergencia/' | relative_url }}">Contactos Úteis</a>
                <a href="{{ '/veterinarios/' | relative_url }}">Veterinários</a>
                <a href="https://github.com/ajudaanimal/alerta" target="_blank" rel="noopener noreferrer">GitHub</a>
                <span>&copy; {{ 'now' | date: "%Y" }}</span>
            </div>
        </div>
    </footer>

    <script>
        function toggleGlobalDarkMode() {
            let isDark = document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
        }
    </script>
    {% include mobile-system.html %}
</body>
</html>
