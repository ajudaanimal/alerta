<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- SEO & Open Graph / Redes Sociais -->
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:description" content="{{ page.description }}">
    {% endif %}
    
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    
    {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
    {% endif %}

    <!-- Script para carregar o modo escuro sem piscar a página -->
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
        }

        html.dark-mode {
            --bg-color: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Cabeçalho Global Minificado (Linha e meia / compacto) */
        .site-global-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            height: 38px;
            box-sizing: border-box;
            flex-shrink: 0;
            z-index: 2000;
        }

        .site-title {
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-main);
            white-space: nowrap;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .fs-nav-links {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .fs-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 100%;
            text-decoration: none;
            font-size: 13px;
            border-left: 1px solid var(--border-color);
            background: transparent;
            box-sizing: border-box;
            transition: background 0.15s;
        }
        .fs-pill:hover {
            background: rgba(100, 100, 100, 0.08);
        }

        .theme-toggle-btn {
            background: transparent;
            border: none;
            border-left: 1px solid var(--border-color);
            width: 38px;
            height: 100%;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .theme-toggle-btn:hover {
            background: rgba(100, 100, 100, 0.08);
        }

        /* Conteúdo Principal */
        .site-main-content {
            padding: 20px 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            flex: 1;
        }

        /* Comportamento Fullscreen para o Mapa/Dashboard */
        body.layout-fullscreen .site-main-content {
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            height: calc(100vh - 38px - 26px) !important;
            flex: none !important;
        }

        /* Rodapé Global Técnico e Hiper-minificado (Uma linha) */
        .site-global-footer {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 0 12px;
            font-size: 11px;
            color: var(--text-muted);
            height: 26px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            z-index: 2000;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: var(--text-main);
            text-decoration: underline;
        }
    </style>
</head>
<body class="{% if page.layout_fullscreen or page.url == '/' or page.url == '/index.html' %}layout-fullscreen{% endif %}">

    <!-- Cabeçalho Global Minificado -->
    <header class="site-global-header">
        <a href="{{ '/' | relative_url }}" class="site-title">🐾 Alerta</a>
        
        <div class="header-right-group">
            <nav class="fs-nav-links" aria-label="Navegação Principal">
                <a href="{{ '/' | relative_url }}" class="fs-pill" title="Mapa">🗺️</a>
                <a href="{{ '/subscrever/' | relative_url }}" class="fs-pill" title="Subscritores">🔔</a>
                <a href="{{ '/emergencia/' | relative_url }}" class="fs-pill" title="Contactos de Emergência">📞</a>
                <a href="https://forms.gle/H8KxdxXfuZz69mW56" target="_blank" rel="noopener noreferrer" class="fs-pill" title="Reportar Ocorrência">➕</a>
            </nav>
            <button type="button" class="theme-toggle-btn" onclick="toggleGlobalDarkMode()" title="Alternar Tema">🌓</button>
        </div>
    </header>

    <!-- Conteúdo da Página -->
    <main class="site-main-content">
        {{ content }}
    </main>

    <!-- Rodapé Global Minificado -->
    <footer class="site-global-footer">
        <div class="footer-left">
            <span><strong>🐾 Ajuda Animal</strong> — Emergência: 112 / GNR (SEPNA)</span>
        </div>
        <div class="footer-links">
            <a href="{{ '/emergencia/' | relative_url }}">Contactos</a>
            <a href="https://github.com/ajudaanimal/alerta" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span>&copy; {{ 'now' | date: "%Y" }}</span>
        </div>
    </footer>

    <script>
        function toggleGlobalDarkMode() {
            let isDark = document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
        }
    </script>
</body>
</html>
