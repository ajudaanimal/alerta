<h1>Últimas Ocorrências</h1>

    </li>
  {% endfor %}
</ul>

<!-- Lista Dinâmica de Ocorrências (Jekyll Liquid Loop)
<section id="ocorrencias" style="margin-bottom: 40px;">
  <h2 style="border-bottom: 2px solid #2e7d32; padding-bottom: 10px; color: #333;">📢 Últimas Ocorrências Registadas</h2>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
    {% for post in site.posts limit:6 %}
      <article style="border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; background: #fff;">
        {% if post.imagem %}
          <img src="{{ post.imagem }}" alt="Foto da ocorrência" style="width: 100%; height: 180px; object-fit: cover;">
        {% endif %}
        <div style="padding: 15px;">
          <span style="background: #2e7d32; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8em;">{{ post.situacao | default: "ALERTA" }}</span>
          <h3 style="margin: 10px 0 5px 0; font-size: 1.2em;">
            <a href="{{ post.url | relative_url }}" style="text-decoration: none; color: #222;">{{ post.title }}</a>
          </h3>
          <p style="font-size: 0.9em; color: #666; margin-bottom: 10px;">📍 {{ post.localizacao | default: "Localização não indicada" }}</p>
          <a href="{{ post.url | relative_url }}" style="color: #2e7d32; font-weight: bold; text-decoration: none; font-size: 0.9em;">Ver detalhes da ficha →</a>
        </div>
      </article>
    {% else %}
      <p>Nenhuma ocorrência registada de momento! 🐾</p>
    {% endfor %}
  </div>
</section>
