---
layout: default
title: Alerta Animal — Mapa Geral
---
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
    .map-wrapper { display: flex; height: 100vh; }
    .map-sidebar { width: 420px; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; z-index: 1001; box-shadow: 2px 0 10px rgba(0,0,0,0.03); }
    .map-container { flex: 1; height: 100%; }
    #full-map { width: 100%; height: 100%; }
    
    .filter-section { padding: 14px; border-bottom: 1px solid #e2e8f0; background: #ffffff; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; z-index: 1000; }
    .filter-header { font-size: 14px; font-weight: 600; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .filter-section input, .filter-section select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: #f8fafc; color: #334155; }
    .filter-section input:focus, .filter-section select:focus { outline: none; border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
    .filter-row { display: flex; gap: 6px; }
    .filter-row select { flex: 1; }

    /* Cartão Lateral Compacto */
    .card-item { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; align-items: center; transition: background 0.15s; }
    .card-item:hover { background: #f8fafc; }
    .card-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; background: #e2e8f0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 16px; }
    .card-info { flex: 1; overflow: hidden; }
    .card-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 11px; color: #64748b; flex-wrap: wrap; }

    .badge { display: inline-block; padding: 2px 5px; font-size: 9px; font-weight: 700; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.2px; }
    .badge-urgente, .badge-risco { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
    .badge-busca { background: #fff7ed; color: #ea580c; border: 1px solid #ffedd5; }
    .badge-monitorizacao { background: #fefce8; color: #ca8a04; border: 1px solid #fef9c3; }
    .badge-resolvido { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }

    /* Popup / Ficha Detalhada */
    .leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .leaflet-popup-content { margin: 0; width: 320px !important; }
    .popup-header { color: white; padding: 8px 12px; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: space-between; }
    .popup-body { padding: 12px; font-size: 11px; color: #334155; line-height: 1.4; display: flex; flex-direction: column; gap: 10px; }
    .popup-top-content { display: flex; gap: 12px; align-items: flex-start; }
    .popup-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; flex-shrink: 0; }
    .popup-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .popup-info p { margin: 0; word-break: break-word; }
    .popup-obs { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; color: #475569; font-style: italic; white-space: pre-wrap; font-size: 11px; max-height: 90px; overflow-y: auto; }

    @media (max-width: 768px) {
      .map-wrapper { flex-direction: column; height: 100vh; }
      .map-sidebar { width: 100%; height: 50%; }
      .map-container { height: 50%; }
    }
  </style>
</head>
<body>
<div class="map-wrapper">
    <div class="map-sidebar">
        <div class="filter-section">
            <div class="filter-header">
                <span>🐾 Alerta Animal</span>
                <span id="contadorResultados" style="font-size: 11px; color: #64748b; font-weight: normal;">A carregar...</span>
            </div>
            
            <input type="text" id="searchInput" placeholder="Pesquisar concelho, rua ou nome..." onkeyup="aplicarFiltros()">
            
            <div class="filter-row">
                <select id="filtroEspecie" onchange="aplicarFiltros()">
                    <option value="">Todas as Espécies</option>
                </select>
                <select id="filtroEstado" onchange="aplicarFiltros()">
                    <option value="">Estado: Todos</option>
                    <option value="Ativo">Ativos</option>
                    <option value="Resolvido">Resolvidos</option>
                </select>
            </div>
            <div class="filter-row">
                <select id="filtroSituacao" onchange="aplicarFiltros()">
                    <option value="">Situação: Todas</option>
                    <option value="DESAPARECIDO">Desaparecido</option>
                    <option value="ENCONTRADO">Encontrado</option>
                </select>
                <select id="filtroAlerta" onchange="aplicarFiltros()">
                    <option value="">Alerta: Todos</option>
                    <option value="EM RISCO">Em Risco</option>
                    <option value="URGENTE">Urgente</option>
                    <option value="BUSCA">Busca</option>
                    <option value="MONITORIZAÇÃO">Monitorização</option>
                </select>
            </div>
        </div>
        <div id="listaOcorrencias">
            <div style="padding: 20px; text-align: center; color: #64748b; font-size: 12px;">A carregar ocorrências...</div>
        </div>
    </div>

    <div class="map-container">
        <div id="full-map"></div>
    </div>
</div>

<script>
let todasOcorrencias = [];
  let map, camadaPins = null;
  const iconCache = {};

  document.addEventListener("DOMContentLoaded", () => {
    map = L.map('full-map', { zoomControl: false }).setView([39.5572, -8.1027], 7);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    camadaPins = L.layerGroup().addTo(map);

    // Carrega os dados de forma assíncrona e segura diretamente da Edge Function
    carregarDadosDaApi();

    map.on('zoomend', () => aplicarFiltros());
  });

  async function carregarDadosDaApi() {
    try {
      const response = await fetch('https://iqnalqnddtbvqgbedvgo.supabase.co/functions/v1/obter-ocorrencias');
      if (!response.ok) throw new Error('Erro ao ligar ao servidor.');
      
      todasOcorrencias = await response.json();
      
      popularFiltroEspecies();
      aplicarFiltros();
    } catch (e) {
      console.error(e);
      document.getElementById('listaOcorrencias').innerHTML = '<div style="padding: 20px; text-align: center; color: red; font-size: 12px;">Erro ao carregar ocorrências.</div>';
    }
  }

  function popularFiltroEspecies() {
    const select = document.getElementById('filtroEspecie');
    const especies = [...new Set(todasOcorrencias.map(i => i['Espécie']).filter(Boolean))];
    especies.sort().forEach(esp => {
      select.innerHTML += `<option value="${esp}">${esp}</option>`;
    });
  }

  function obterEstiloAlerta(alerta, estado) {
    const estadoStr = (estado || '').toLowerCase();
    const alertaStr = (alerta || '').toUpperCase();
    if (estadoStr.includes('resolvido')) return { corHex: '#16a34a', badgeClass: 'badge-resolvido', label: 'RESOLVIDO' };
    if (alertaStr.includes('RISCO') || alertaStr.includes('URGENTE')) return { corHex: '#dc2626', badgeClass: 'badge-urgente', label: alertaStr };
    if (alertaStr.includes('BUSCA')) return { corHex: '#ea580c', badgeClass: 'badge-busca', label: 'BUSCA' };
    return { corHex: '#ca8a04', badgeClass: 'badge-monitorizacao', label: alertaStr || 'MONITORIZAÇÃO' };
  }

  function obterIconeFontAwesome(especie) {
    const esp = (especie || '').toLowerCase();
    if (esp.includes('gato') || esp.includes('felino')) return 'fa-cat';
    if (esp.includes('cão') || esp.includes('cao') || esp.includes('canídeo')) return 'fa-dog';
    if (esp.includes('ave') || esp.includes('pássaro')) return 'fa-dove';
    return 'fa-paw';
  }

  function calcularTamanhoPin() {
    const zoom = map ? map.getZoom() : 7;
    if (zoom <= 6) return 14;
    if (zoom <= 8) return 20;
    if (zoom <= 10) return 28;
    if (zoom <= 13) return 36;
    return 46;
  }

  function obterDivIconCached(faIcon, corHex, pinSize) {
    const cacheKey = `${faIcon}_${corHex}_${pinSize}`;
    if (iconCache[cacheKey]) return iconCache[cacheKey];
    const fontSizeIcon = Math.max(10, Math.floor(pinSize * 0.45));
    const pinHtml = `<div style="background:${corHex}; width:${pinSize}px; height:${pinSize}px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; color:#ffffff; font-size:${fontSizeIcon}px;"><i class="fa-solid ${faIcon}"></i></div>`;
    const customIcon = L.divIcon({ html: pinHtml, className: 'custom-fa-pin', iconSize: [pinSize, pinSize], iconAnchor: [pinSize/2, pinSize/2] });
    iconCache[cacheKey] = customIcon;
    return customIcon;
  }

  function obterUrlFoto(item) {
    let url = item['Link Anexo'] || '';
    url = String(url).trim();
    if (!url || url.length < 5) return '';
    if (url.includes('drive.google.com')) {
      let fileId = '';
      if (url.includes('/file/d/')) {
        const parts = url.split('/file/d/');
        if (parts[1]) fileId = parts[1].split('/')[0];
      } else if (url.includes('id=')) {
        const match = url.match(/[?&]id=([^&]+)/);
        if (match) fileId = match[1];
      }
      if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
    }
    if (url.startsWith('http://')) url = url.replace('http://', 'https://');
    return url;
  }

  function aplicarFiltros() {
    const termo = document.getElementById('searchInput').value.toLowerCase();
    const especieSel = document.getElementById('filtroEspecie').value;
    const estadoSel = document.getElementById('filtroEstado').value;
    const situacaoSel = document.getElementById('filtroSituacao').value;
    const alertaSel = document.getElementById('filtroAlerta').value;

    const filtrados = todasOcorrencias.filter(i => {
      const esp = (i['Espécie'] || '').toLowerCase();
      const conc = (i['Concelho'] || '').toLowerCase();
      const nome = (i['Nome do Animal'] || '').toLowerCase();
      const estado = (i['Estado'] || '').trim();
      const situacao = (i['Situação'] || '').toUpperCase();
      const alerta = (i['Nível de Alerta'] || '').toUpperCase();

      const matchTermo = !termo || conc.includes(termo) || nome.includes(termo) || esp.includes(termo);
      const matchEspecie = !especieSel || i['Espécie'] === especieSel;
      const matchEstado = !estadoSel || estado.toLowerCase().includes(estadoSel.toLowerCase());
      const matchSituacao = !situacaoSel || situacao.includes(situacaoSel.toUpperCase());
      const matchAlerta = !alertaSel || alerta.includes(alertaSel);

      return matchTermo && matchEspecie && matchEstado && matchSituacao && matchAlerta;
    });

    document.getElementById('contadorResultados').innerText = `${filtrados.length} casos`;
    renderizar(filtrados);
  }

  function renderizar(dados) {
    const listaHtml = document.getElementById('listaOcorrencias');
    listaHtml.innerHTML = '';
    camadaPins.clearLayers();

    if (dados.length === 0) {
      listaHtml.innerHTML = '<div style="padding: 25px; text-align: center; color: #64748b; font-size: 12px;">Sem ocorrências encontradas.</div>';
      return;
    }

    const pinSize = calcularTamanhoPin();

    dados.forEach(item => {
      const lat = Number(item['Latitude']);
      const lon = Number(item['Longitude']);
      if (isNaN(lat) || isNaN(lon)) return;

      const especie = item['Espécie'] || 'Animal';
      const concelho = item['Concelho'] || 'Local desconhecido';
      const foto = obterUrlFoto(item);
      const nomeAnimal = item['Nome do Animal'] ? ` (${item['Nome do Animal']})` : '';
      const condicaoFisica = item['Condição Física'] || 'N/D';
      const observacoes = item['Observações'] || '';
      const dataOcorrencia = item['Data da Ocorrência'] || '';
      const triagem = obterEstiloAlerta(item['Nível de Alerta'], item['Estado']);
      const faIcon = obterIconeFontAwesome(especie);

      const imgHtml = foto 
        ? `<img src="${foto}" class="card-img" alt="" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\'card-img\'><i class=\'fa-solid fa-paw\'></i></div>';">`
        : `<div class="card-img"><i class="fa-solid fa-paw"></i></div>`;

      const popupImgHtml = foto ? `<img src="${foto}" class="popup-img" onerror="this.style.display='none'" alt="">` : '';

      const cardDiv = document.createElement('div');
      cardDiv.className = 'card-item';
      cardDiv.onclick = () => focarNoMapa(lat, lon, 15);
      cardDiv.innerHTML = `
        ${imgHtml}
        <div class="card-info">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size: 12px; color: #1e293b;">${especie}${nomeAnimal}</strong>
            ${dataOcorrencia ? `<span style="font-size: 10px; color: #94a3b8;">${dataOcorrencia}</span>` : ''}
          </div>
          <div style="font-size: 11px; color: #475569; margin-top: 2px;">📍 ${concelho}</div>
          <div class="card-meta">
            <span class="badge ${triagem.badgeClass}">${triagem.label}</span>
            <span style="color: #64748b;">• ${condicaoFisica}</span>
          </div>
        </div>
      `;
      listaHtml.appendChild(cardDiv);

      const customIcon = obterDivIconCached(faIcon, triagem.corHex, pinSize);
      const popupContent = `
        <div class="popup-header" style="background: ${triagem.corHex};">
          <span>${especie}${nomeAnimal}</span>
          <span style="font-size: 10px; font-weight: normal;">${dataOcorrencia}</span>
        </div>
        <div class="popup-body">
          <div class="popup-top-content">
            ${popupImgHtml}
            <div class="popup-info">
              <p><strong>Local:</strong> ${concelho}</p>
              <p><strong>Condição Física:</strong> ${condicaoFisica}</p>
              <p><strong>Nível de Alerta:</strong> ${triagem.label}</p>
              ${dataOcorrencia ? `<p><strong>Data da Ocorrência:</strong> ${dataOcorrencia}</p>` : ''}
            </div>
          </div>
          ${observacoes ? `<div class="popup-obs"><strong>Descrição / Observações:</strong><br>${observacoes}</div>` : ''}
        </div>
      `;

      const marker = L.marker([lat, lon], { icon: customIcon }).bindPopup(popupContent);
      camadaPins.addLayer(marker);
    });
  }

  function focarNoMapa(lat, lon, zoom = 15) {
    if (lat && lon) {
      map.flyTo([lat, lon], zoom, { duration: 0.8 });
    }
  }
</script>
</body>
</html>
