---
layout: default
title: "Mapa Geral de Ocorrências — Alerta Animal"
---

<!-- Leaflet CSS e JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
    :root {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --box-bg: #f8fafc;
    }

    html.dark-mode {
        --bg-color: #0b0f19;
        --card-bg: #111827;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --border-color: #374151;
        --box-bg: #1f2937;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .dashboard-container {
        max-width: 1200px;
        margin: 16px auto;
        padding: 0 16px;
        box-sizing: border-box;
    }

    .filters-bar {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
    }

    .filter-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
    }

    .filter-btn {
        background: var(--box-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
    }

    .filter-btn:hover, .filter-btn.active {
        background: var(--border-color);
        border-color: var(--text-muted);
    }

    #mapa-geral {
        width: 100%;
        height: 650px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .custom-map-pin {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        font-size: 10px;
        font-weight: bold;
        color: #fff;
    }
</style>

<div class="dashboard-container">
    <div class="filters-bar">
        <div class="filter-group" id="alert-filters">
            <span style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-right: 4px;">Nível Alerta:</span>
            <button class="filter-btn active" data-filter="all">Todos (<span id="count-all">0</span>)</button>
            <button class="filter-btn" data-filter="red">Vermelho (<span id="count-red">0</span>)</button>
            <button class="filter-btn" data-filter="orange">Laranja (<span id="count-orange">0</span>)</button>
            <button class="filter-btn" data-filter="yellow">Amarelo (<span id="count-yellow">0</span>)</button>
        </div>
        <div class="filter-group" id="physical-filters">
            <span style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-right: 4px;">Condição Física:</span>
            <button class="filter-btn" data-physical="ferido">Ferido / Crítico (<span id="count-ferido">0</span>)</button>
            <button class="filter-btn" data-physical="debilitado">Debilitado (<span id="count-debilitado">0</span>)</button>
        </div>
    </div>

    <div id="mapa-geral"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var map = L.map('mapa-geral', {
            attributionControl: false
        }).setView([39.5572, -7.8537], 7);

        L.control.attribution({ prefix: false }).addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors').addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var markersGroup = L.layerGroup().addTo(map);
        var allCasesData = [
            {% for post in site.posts %}
            {
                id: {{ post.id | jsonify }},
                especie: {{ post.especie | default: "Animal" | jsonify }},
                url: {{ post.url | relative_url | jsonify }},
                lat: {{ post.lat | default: "null" }},
                lon: {{ post.lon | default: "null" }},
                localidade: {{ post.localidade | default: post.concelho | default: "Portugal" | jsonify }},
                triagem: {{ post.triagem | default: "" | upcase | jsonify }},
                estado_fisico: {{ post.estado_fisico | default: "" | jsonify }},
                imagem: {{ post.imagem | default: "" | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {% endfor %}
        ];

        var markersList = [];

        function renderMarkers(filterType, physicalType) {
            markersGroup.clearLayers();
            markersList = [];

            let counts = { all: 0, red: 0, orange: 0, yellow: 0, ferido: 0, debilitado: 0 };

            allCasesData.forEach(item => {
                let t = item.triagem;
                let ef = item.estado_fisico.toLowerCase();

                let color = "#ca8a04";
                let typeKey = "yellow";
                if (t.includes('VERM') || ef.includes('ferido') || ef.includes('crítico')) {
                    color = "#dc2626";
                    typeKey = "red";
                } else if (t.includes('LARANJA') || ef.includes('urgente')) {
                    color = "#f97316";
                    typeKey = "orange";
                }

                counts.all++;
                counts[typeKey]++;
                if (ef.includes('ferido') || ef.includes('crítico')) counts.ferido++;
                if (ef.includes('debilitado') || ef.includes('magro')) counts.debilitado++;

                let matchesAlert = (filterType === 'all' || typeKey === filterType);
                let matchesPhysical = (!physicalType || (physicalType === 'ferido' && (ef.includes('ferido') || ef.includes('crítico'))) || (physicalType === 'debilitado' && (ef.includes('debilitado') || ef.includes('magro'))));

                if (matchesAlert && matchesPhysical && item.lat && item.lon) {
                    var customIcon = L.divIcon({
                        className: 'custom-map-pin',
                        html: `<div style="background-color: ${color}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff;"></div>`,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });

                    var marker = L.marker([item.lat, item.lon], { icon: customIcon })
                        .bindPopup(`<b>${item.especie}</b><br>${item.localidade}<br><a href="${item.url}" target="_blank">Ver Ocorrência</a>`);
                    
                    markersGroup.addLayer(marker);
                    markersList.push(marker);
                }
            });

            document.getElementById('count-all').innerText = counts.all;
            document.getElementById('count-red').innerText = counts.red;
            document.getElementById('count-orange').innerText = counts.orange;
            document.getElementById('count-yellow').innerText = counts.yellow;
            document.getElementById('count-ferido').innerText = counts.ferido;
            document.getElementById('count-debilitado').innerText = counts.debilitado;
        }

        renderMarkers('all', null);

        let currentAlertFilter = 'all';
        let currentPhysicalFilter = null;

        document.querySelectorAll('#alert-filters .filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#alert-filters .filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentAlertFilter = this.getAttribute('data-filter');
                renderMarkers(currentAlertFilter, currentPhysicalFilter);

                if (currentAlertFilter === 'all' && !currentPhysicalFilter && markersList.length > 0) {
                    var group = new L.featureGroup(markersList);
                    map.fitBounds(group.getBounds().pad(0.1));
                } else if (markersList.length > 0) {
                    var group = new L.featureGroup(markersList);
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            });
        });

        document.querySelectorAll('#physical-filters .filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                let pType = this.getAttribute('data-physical');
                if (currentPhysicalFilter === pType) {
                    this.classList.remove('active');
                    currentPhysicalFilter = null;
                } else {
                    document.querySelectorAll('#physical-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentPhysicalFilter = pType;
                }
                renderMarkers(currentAlertFilter, currentPhysicalFilter);
                if (markersList.length > 0) {
                    var group = new L.featureGroup(markersList);
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            });
        });
    });
</script>
